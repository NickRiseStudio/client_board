# =============================================================================
# KEEP-ALIVE: поддержание жизни бесплатного проекта Supabase
# =============================================================================
# Бесплатный план Supabase ставит проект на паузу, если 7 дней не было НИ ОДНОГО
# запроса к API. Чтобы доска не «отключалась» без вашего участия, этот workflow
# раз в 3 дня делает лёгкий read-only запрос к REST-эндпоинту БД — «будит» её.
#
# Запрос ничего не создаёт и не меняет: только читает 1 строку (select id limit 1).
# Данные на доске остаются полностью нетронутыми, внешний вид не меняется.
#
# ВАЖНО: anon-ключ ниже — публичный (тот же, что уже лежит в config.js),
# рассчитан на открытое использование в клиенте, поэтому его можно хранить здесь.
# =============================================================================
name: Supabase keep-alive

on:
  schedule:
    # Раз в 3 дня в 05:00 UTC (примерно утро в любом часовом поясе)
    - cron: '0 5 */3 * *'
  workflow_dispatch: {}   # Кнопка «Run workflow» во вкладке Actions для ручной проверки

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Пинг Supabase REST API
        env:
          SUPABASE_URL: https://phstljqmahjshyiqnwyd.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBoc3RsanFtYWhqc2h5aXFud3lkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1NDYxMDMsImV4cCI6MjEwNDEyMjEwM30.n29JnaU9YKKrSgfdpr06WKJT1JGQrtHvfkldSroCHs4
        run: |
          curl -fsS --max-time 30 -o /dev/null \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/kanban_columns?select=id&limit=1"
